<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <h1><i><b>Tic-Tac-Toe</b></i></h1>
    <div class="msg-container hide">
        <p id="msg">Winner</p>
        <p id="score">Score</p>
        <button id="newbtn">Play Again</button>
        <button id="resetscore">Reset Score</button>
    </div>
    <hr>
    <hr>
    </header>
    <main>
        <div class="container">
            <div class="game">
              <button class="box"></button>
              <button class="box" id="b2"></button>
              <button class="box" id="b3"></button>
              <button class="box" id="b4"></button>
              <button class="box" id="b5"></button>
              <button class="box" id="b6"></button>
              <button class="box" id="b7"></button>
              <button class="box" id="b8"></button>
              <button class="box" id="b9"></button>
            </div>
        </div>
        <button id="resetbtn">Reset Game</button>
    </main>
    <footer>
    
    </footer>
 <script src="script.js"></script>
</body>
</html>
